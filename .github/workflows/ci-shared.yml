name: ci-shared

on:
  pull_request:
    paths:
      - "shared/**"
      - "gradle/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - ".github/workflows/ci-shared.yml"
  push:
    branches: [main]
    paths:
      - "shared/**"
      - "gradle/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"

jobs:
  build-and-test:
    # macOS runner is required for Kotlin/Native iOS targets.
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run shared :check
        run: ./gradlew :shared:check

      - name: Assemble shared release XCFramework
        run: ./gradlew :shared:assembleSharedReleaseXCFramework
