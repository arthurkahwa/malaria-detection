name: ci-android

on:
  pull_request:
    paths:
      - "androidApp/**"
      - "shared/**"
      - ".github/workflows/ci-android.yml"
  push:
    branches: [main]
    paths:
      - "androidApp/**"
      - "shared/**"

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Android debug + run JVM unit tests
        run: ./gradlew :androidApp:assembleDebug :androidApp:testDebugUnitTest

      # TODO (Phase 5+): once Room is wired in `androidApp`, add the
      # emulator-backed instrumentation step here using
      # `reactivecircus/android-emulator-runner` to run
      # `./gradlew :androidApp:connectedDebugAndroidTest`.
      # See spec §21 (`ci-android.yml` deliverables).
